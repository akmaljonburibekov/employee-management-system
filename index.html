
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Management System</title>
  <link rel="stylesheet" href="style.css">
  <script src="index.js" defer></script>
</head>
<body>

  <header>
    <h1>Employee Management System</h1>
  </header>

  <main>
    <section class="dashboard">
      <h2>Dashboard</h2>
    </section>

    <section class="employees">
      <h2>Employees</h2>

      <button id="addEmployeeBtn">Add Employee</button>
      

      <!-- SEARCHING -->
      <div class="search-container">
        <span class="search-icon">🔍</span>

        <input
          type="search"
          id="searchInput"
          placeholder="Search by first or last name..."
        >
      </div>


      <div id="overlay" hidden></div>

      <form id="employeeForm" hidden novalidate>
        <label for="firstName">First Name</label>
        <input type="text" id="firstName" required>
      
        <label for="lastName">Last Name</label>
        <input type="text" id="lastName" required>
      
        <label for="age">Age</label>
        <input type="number" id="age" required>
      
        <label for="position">Position</label>
        <input type="text" id="position" required>
      
        <label for="department">Department</label>
        <input type="text" id="department" required>
      
        <label for="salary">Salary</label>
        <input type="number" id="salary" step="0.01" required>
      
        <label for="email">Email</label>
        <input type="email" id="email" required>
      
        <button type="submit" id="saveEmployeeBtn">
          Save Employee
        </button>

        <button type="button" id="putEmployeeBtn">
          Update Employee
        </button>

        <button type="button" id="patchEmployeeBtn">
          Partial Update
        </button>

      </form>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Age</th>
            <th>Position</th>
            <th>Department</th>
            <th>Salary</th>
            <th>Email</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="employeesList">
        </tbody>
      </table>
      <!-- Pagination shu yerda -->
      <div id="pagination" class="pagination"></div>
    </section>
  </main>


  <div id="toast"></div>

  <div id="loading">
    <div class="spinner"></div>
    <p>Ma'lumotlar yuklanmoqda...</p>
  </div>

</body>
</html>
